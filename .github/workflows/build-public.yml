# Builds the Next.js app in src/ and commits the static export to public/ (served
# from main). Daily, it first pulls the published research catalog from
# ndif-team/ndif-citations (spec §5.6) and checks that the catalog pipeline is alive.
name: Build site into public/

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "Makefile"
      - ".github/workflows/build-public.yml"
  schedule:
    - cron: "41 7 * * *"   # daily, after the Monday 05:17 catalog run; off the hour
  workflow_dispatch: {}

concurrency:
  group: build-public
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    # The bot's own commits only touch public/ + synced data — belt-and-braces against loops.
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Fetch the citations catalog
        id: citations
        continue-on-error: true
        uses: actions/checkout@v7
        with:
          repository: ndif-team/ndif-citations
          path: _citations
          persist-credentials: false
          sparse-checkout: output
          fetch-depth: 1

      - name: Sync catalog into src/public (sanity-checked; images additive)
        id: sync
        if: steps.citations.outcome == 'success'
        continue-on-error: true
        env:
          FORCE: ${{ vars.CATALOG_SYNC_FORCE }}   # set to 1 once to accept a legitimate >10% drop
        run: |
          set -euo pipefail
          FORCE="${FORCE:-}"
          src=_citations/output
          # A symlinked output/ or output/images/ (git stores symlinks) would resolve outside the checkout.
          if [ -L "$src" ] || [ -L "$src/images" ]; then
            echo "::warning::$src or $src/images is a symlink — keeping the site's data"
            echo "Catalog sync **skipped**: output directory is a symlink" >> "$GITHUB_STEP_SUMMARY"
            echo "blocked=output-symlink" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Before the catalog's first commit (Phase 2 Task 5) output/ doesn't exist; afterwards a
          # missing slim file is a real break: new=-1 below reports it as blocked.
          [ -d "$src" ] || { echo "No catalog in ndif-citations yet — keeping the site's data" >> "$GITHUB_STEP_SUMMARY"; exit 0; }
          [ "$FORCE" = 1 ] && echo "::warning::CATALOG_SYNC_FORCE=1 is set — the 90% check is off; delete the variable after this build"
          # Length of the single top-level array if it is well-formed and safe, else -1. Entries must be
          # objects; url/linked_paper_url must be http(s); image must be /images/<name>.<png|jpg|jpeg|webp|gif>.
          # (\A..\z: jq regexes are Ruby-style, where ^/$ match at line breaks.)
          prog='def okurl: . == null or . == "" or (type == "string" and test("\\Ahttps?://"; "i"));
                def okimg: . == null or . == "" or (type == "string" and test("\\A/images/[^/\\p{Cc}]+\\.(png|jpe?g|webp|gif)\\z"; "i"));
                if length == 1 and (.[0] | type) == "array"
                   and (.[0] | all(type == "object" and (.url | okurl) and (.linked_paper_url | okurl) and (.image | okimg)))
                then (.[0] | length) else -1 end'
          for f in research-papers.json github-repos.json; do
            if [ -f "$src/$f" ] && [ ! -L "$src/$f" ]; then new=$(jq -s "$prog" "$src/$f" 2>/dev/null) || new=-1; else new=-1; fi
            [[ $new =~ ^[0-9]+$ ]] || new=-1
            cur=$(jq 'length' "src/public/data/$f" 2>/dev/null) || cur=0
            [[ $cur =~ ^[0-9]+$ ]] || cur=0
            if [ "$new" -lt 0 ] || { [ "$FORCE" != 1 ] && [ $((new * 10)) -lt $((cur * 9)) ]; }; then
              echo "::warning::$f failed the sanity check (new=$new, current=$cur) — keeping the site's data"
              echo "Catalog sync **skipped**: $f new=$new current=$cur" >> "$GITHUB_STEP_SUMMARY"
              echo "blocked=$f new=$new current=$cur" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          # Images are additive: always copy a new file; overwrite an existing one only if the site's CURRENT
          # (pre-copy) catalog references it, the bytes differ, AND its filename appears nowhere in site
          # source (headshots/logos/diagrams are referenced from src/data, src/components, ...). JSON goes last.
          jq -r '.[].image // empty' src/public/data/research-papers.json > "$RUNNER_TEMP/cur-images.txt" 2>/dev/null || : > "$RUNNER_TEMP/cur-images.txt"
          jq -r '.[].image // empty' "$src/research-papers.json" | while read -r img; do
            name=$(basename "$img")
            s="$src/images/$name"; d="src/public/images/$name"
            [ -f "$s" ] && [ ! -L "$s" ] || continue
            if [ ! -e "$d" ]; then cp "$s" "$d"
            elif grep -qxF "/images/$name" "$RUNNER_TEMP/cur-images.txt" && ! cmp -s "$s" "$d" \
                 && ! grep -rqF --exclude-dir=public --exclude-dir=out --exclude-dir=.next --exclude-dir=node_modules -- "$name" src; then
              cp "$s" "$d"
            fi
          done
          cp "$src/research-papers.json" "$src/github-repos.json" src/public/data/
          echo "Catalog synced from ndif-citations@$(git -C _citations rev-parse --short HEAD)" >> "$GITHUB_STEP_SUMMARY"

      - name: Report a blocked catalog sync
        if: steps.citations.outcome == 'failure' || steps.sync.outcome == 'failure' || steps.sync.outputs.blocked != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          BLOCKED: ${{ steps.sync.outputs.blocked || 'the catalog fetch/sync step failed' }}
        run: |
          msg="Daily catalog sync was **skipped**: $BLOCKED (sanity check: new list must parse and keep ≥90% of the current entries). If the drop is legitimate, set the repo variable CATALOG_SYNC_FORCE=1 for one build, then delete it. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          n=$(gh issue list --label catalog-sync-blocked --state open --json number --jq '.[0].number // empty')
          if [ -n "$n" ]; then gh issue comment "$n" --body "$msg"
          else gh label create catalog-sync-blocked --color d73a4a --force >/dev/null
               gh issue create --label catalog-sync-blocked --title "Catalog sync blocked" --body "$msg"; fi

      - name: Dead-man's switch (is the catalog pipeline still running?)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          api="https://api.github.com/repos/ndif-team/ndif-citations/actions/workflows/catalog-run.yml/runs?status=success&per_page=1"
          if ! body=$(curl -fsS "$api"); then
            echo "::warning::Dead-man check could not query catalog-run.yml runs"
            echo "Dead-man check skipped: API error" >> "$GITHUB_STEP_SUMMARY"; exit 0
          fi
          last=$(jq -r '.workflow_runs[0].updated_at // empty' <<< "$body")
          if [ -z "$last" ]; then
            echo "Dead-man check: no successful catalog run yet (no data)" >> "$GITHUB_STEP_SUMMARY"; exit 0
          fi
          age=$(( ( $(date -u +%s) - $(date -u -d "$last" +%s) ) / 86400 ))
          echo "Last successful catalog run: $last ($age days ago)" >> "$GITHUB_STEP_SUMMARY"
          if [ "$age" -gt 8 ]; then
            msg="The ndif-citations catalog pipeline last succeeded **$age days ago** ($last). See https://github.com/ndif-team/ndif-citations/actions and the README \"Operations runbook\". Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            n=$(gh issue list --label catalog-stale --state open --json number --jq '.[0].number // empty')
            if [ -n "$n" ]; then
              gh issue comment "$n" --body "$msg"
            else
              gh label create catalog-stale --color d73a4a --force >/dev/null
              gh issue create --label catalog-stale --title "Citations catalog is stale" --body "$msg"
            fi
          fi

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Build static export
        working-directory: src
        env:
          # Build ID derives from the build inputs (not the commit SHA), so a
          # bot commit that changes no input yields byte-identical output.
          BUILD_ID: ${{ hashFiles('src/**', '!src/node_modules/**', '!src/out/**', '!src/.next/**') }}
          # Lifts the GitHub API rate limit for scripts/fetch-org-stats.mjs
          # (which degrades to the committed org-stats.json on any failure).
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "BUILD_ID=$BUILD_ID" >> "$GITHUB_ENV"  # reused by the commit message
          bun install --frozen-lockfile
          bun run build

      - name: Publish export to public/
        run: |
          rm -rf public
          cp -R src/out public

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A public src/data/org-stats.json src/public/data src/public/images
          if git diff --cached --quiet; then
            echo "public/ unchanged — nothing to commit"
            exit 0
          fi
          git commit -m "build: refresh public/ (inputs ${BUILD_ID:0:12})"
          git push origin main || (git pull --rebase origin main && git push origin main)
