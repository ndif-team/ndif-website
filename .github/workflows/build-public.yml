# Builds the Next.js app in src/ and commits the static export to public/ (served
# from main). Daily, it first pulls the published research catalog from
# ndif-team/ndif-citations (spec §5.6) and checks that the catalog pipeline is alive.
name: Build site into public/

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "Makefile"
      - ".github/workflows/build-public.yml"
  schedule:
    - cron: "41 7 * * *"   # daily, after the Monday 05:17 catalog run; off the hour
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

concurrency:
  group: build-public
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # The bot's own commits only touch public/ + synced data — belt-and-braces against loops.
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v7

      - name: Fetch the citations catalog
        id: citations
        continue-on-error: true
        uses: actions/checkout@v7
        with:
          repository: ndif-team/ndif-citations
          path: _citations
          sparse-checkout: output
          fetch-depth: 1

      - name: Sync catalog into src/public (sanity-checked; images additive)
        id: sync
        if: steps.citations.outcome == 'success'
        continue-on-error: true
        env:
          FORCE: ${{ vars.CATALOG_SYNC_FORCE }}   # set to 1 once to accept a legitimate >10% drop
        run: |
          set -euo pipefail
          src=_citations/output
          # Before the catalog's first commit (Phase 2 Task 5) output/ doesn't exist; afterwards a
          # missing slim file is a real break: new=-1 below reports it as blocked.
          [ -d "$src" ] || { echo "No catalog in ndif-citations yet — keeping the site's data" >> "$GITHUB_STEP_SUMMARY"; exit 0; }
          for f in research-papers.json github-repos.json; do
            new=$(jq 'if type == "array" then length else -1 end' "$src/$f" 2>/dev/null || echo -1)
            cur=$(jq 'length' "src/public/data/$f" 2>/dev/null || echo 0)
            if [ "$new" -lt 0 ] || { [ "$FORCE" != 1 ] && [ $((new * 10)) -lt $((cur * 9)) ]; }; then
              echo "::warning::$f failed the sanity check (new=$new, current=$cur) — keeping the site's data"
              echo "Catalog sync **skipped**: $f new=$new current=$cur" >> "$GITHUB_STEP_SUMMARY"
              echo "blocked=$f new=$new current=$cur" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          cp "$src/research-papers.json" "$src/github-repos.json" src/public/data/
          jq -r '.[].image // empty' "$src/research-papers.json" | while read -r img; do
            name=$(basename "$img")
            [ -f "$src/images/$name" ] || continue
            cmp -s "$src/images/$name" "src/public/images/$name" || cp "$src/images/$name" "src/public/images/$name"
          done
          echo "Catalog synced from ndif-citations@$(git -C _citations rev-parse --short HEAD)" >> "$GITHUB_STEP_SUMMARY"

      - name: Report a blocked catalog sync
        if: steps.citations.outcome == 'failure' || steps.sync.outcome == 'failure' || steps.sync.outputs.blocked != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          BLOCKED: ${{ steps.sync.outputs.blocked || 'the catalog fetch/sync step failed' }}
        run: |
          msg="Daily catalog sync was **skipped**: $BLOCKED (sanity check: new list must parse and keep ≥90% of the current entries). If the drop is legitimate, set the repo variable CATALOG_SYNC_FORCE=1 for one build, then delete it."
          n=$(gh issue list --label catalog-sync-blocked --state open --json number --jq '.[0].number // empty')
          if [ -n "$n" ]; then gh issue comment "$n" --body "$msg"
          else gh label create catalog-sync-blocked --color d73a4a --force >/dev/null
               gh issue create --label catalog-sync-blocked --title "Catalog sync blocked" --body "$msg"; fi

      - name: Dead-man's switch (is the catalog pipeline still running?)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          api="https://api.github.com/repos/ndif-team/ndif-citations/actions/workflows/catalog-run.yml/runs?status=success&per_page=1"
          if ! body=$(curl -fsS "$api"); then
            echo "Dead-man check skipped: API error" >> "$GITHUB_STEP_SUMMARY"; exit 0
          fi
          last=$(jq -r '.workflow_runs[0].updated_at // empty' <<< "$body")
          if [ -z "$last" ]; then
            echo "Dead-man check: no successful catalog run yet (no data)" >> "$GITHUB_STEP_SUMMARY"; exit 0
          fi
          age=$(( ( $(date -u +%s) - $(date -u -d "$last" +%s) ) / 86400 ))
          echo "Last successful catalog run: $last ($age days ago)" >> "$GITHUB_STEP_SUMMARY"
          if [ "$age" -gt 8 ]; then
            msg="The ndif-citations catalog pipeline last succeeded **$age days ago** ($last). See https://github.com/ndif-team/ndif-citations/actions and the README \"Operations runbook\"."
            n=$(gh issue list --label catalog-stale --state open --json number --jq '.[0].number // empty')
            if [ -n "$n" ]; then
              gh issue comment "$n" --body "$msg"
            else
              gh label create catalog-stale --color d73a4a --force >/dev/null
              gh issue create --label catalog-stale --title "Citations catalog is stale" --body "$msg"
            fi
          fi

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Build static export
        working-directory: src
        env:
          # Lifts the GitHub API rate limit for scripts/fetch-org-stats.mjs
          # (which degrades to the committed org-stats.json on any failure).
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Publish export to public/
        run: |
          rm -rf public
          cp -R src/out public

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A public src/data/org-stats.json src/public/data src/public/images
          if git diff --cached --quiet; then
            echo "public/ unchanged — nothing to commit"
            exit 0
          fi
          git commit -m "build: refresh public/ for ${GITHUB_SHA}"
          git push origin main || (git pull --rebase origin main && git push origin main)
